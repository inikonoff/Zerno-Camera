name: Build Zerno debug APK

on:
  push:
    branches:
      - ccr-b72d629a-20vyqk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          # the action's default packages ("tools platform-tools") include "tools", which sdkmanager
          # no longer has: the step failed with "Failed to find package 'tools'". The needed
          # packages are installed in the next step.
          packages: ''
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK
        run: bash ./gradlew --no-daemon assembleDebug
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Zerno-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
