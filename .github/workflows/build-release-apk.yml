name: Build Zerno release APK

on:
  push:
    branches:
      - ccr-b72d629a-20vyqk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ZERNO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ZERNO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZERNO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ZERNO_KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
            echo "SIGNING=your own key" >> "$GITHUB_ENV"
          else
            # No key in the repository secrets: a throwaway key, so that the APK can still be
            # installed. Every build then has a different signature, so an update over an earlier
            # build needs that one removed first.
            KEYSTORE_PASSWORD=zerno-temporary
            KEY_PASSWORD=zerno-temporary
            KEY_ALIAS=zerno
            keytool -genkeypair -keystore keystore/release.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Zerno temporary build"
            echo "SIGNING=throwaway key" >> "$GITHUB_ENV"
          fi
          {
            echo "storeFile=keystore/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
      - name: Build release APK
        run: bash ./gradlew --no-daemon assembleRelease
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Zerno-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
